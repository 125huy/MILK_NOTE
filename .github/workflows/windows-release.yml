name: MilkNote Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run tauri:build -- --bundles nsis,msi
      - name: Create portable ZIP
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release"
          $exe = Get-ChildItem $bundle -Filter "MilkNote.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "MilkNote.exe was not found" }
          $portable = "${{ github.workspace }}/MilkNote-portable-windows-x64"
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item $exe.FullName "$portable/MilkNote.exe"
          New-Item -ItemType File "$portable/portable.flag" | Out-Null
          Compress-Archive -Path "$portable/*" -DestinationPath "MilkNote-portable-windows-x64.zip" -Force
      - name: Hash artifacts
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle -Recurse -File | Get-FileHash -Algorithm SHA256 | Out-File SHA256SUMS.txt
          Get-FileHash MilkNote-portable-windows-x64.zip -Algorithm SHA256 | Out-File -Append SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MilkNote-Windows-artifacts
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            MilkNote-portable-windows-x64.zip
            SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            MilkNote-portable-windows-x64.zip
            SHA256SUMS.txt
